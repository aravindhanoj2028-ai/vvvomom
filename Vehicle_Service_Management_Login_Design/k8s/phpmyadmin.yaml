apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service-phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vehicle-service-phpmyadmin
  template:
    metadata:
      labels:
        app: vehicle-service-phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:latest
          ports:
            - containerPort: 80
          env:
            - name: PMA_HOST
              value: vehicle-service-db
            - name: PMA_PORT
              value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-service-phpmyadmin
spec:
  type: NodePort
  selector:
    app: vehicle-service-phpmyadmin
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
